name: Doppio

options:
  bundleIdPrefix: local.doppio
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Personal build: ad-hoc signed, no team, no sandbox.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Doppio:
    type: application
    platform: macOS
    sources: [Doppio]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Doppio/Info.plist
      properties:
        CFBundleDisplayName: Doppio
        # Menu bar only: no Dock icon, no app menu.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.doppio.Doppio
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DoppioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DoppioTests]
    dependencies:
      - target: Doppio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.doppio.DoppioTests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Doppio.app/Contents/MacOS/Doppio

schemes:
  Doppio:
    build:
      targets:
        Doppio: all
        DoppioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoppioTests
