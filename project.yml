name: Doppio

options:
  bundleIdPrefix: io.github.lantelyes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 3.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc signed: no Apple Developer team, no sandbox, not notarized.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

targets:
  Doppio:
    type: application
    platform: macOS
    sources: [Doppio]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Doppio/Info.plist
      properties:
        CFBundleDisplayName: Doppio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu bar only: no Dock icon, no app menu.
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lantelyes.doppio
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DoppioTests:
    type: bundle.unit-test
    platform: macOS
    sources: [DoppioTests]
    dependencies:
      - target: Doppio
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lantelyes.doppio.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Doppio.app/Contents/MacOS/Doppio

schemes:
  Doppio:
    build:
      targets:
        Doppio: all
        DoppioTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DoppioTests
